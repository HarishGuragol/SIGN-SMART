<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Smart</title>
<style>
  :root {
    --ink:#14213D; --bg:#FAFAF8; --surface:#fff; --accent:#F08A24;
    --line:#ECEAE4; --muted:#8A8F9C; --user-bg:#14213D; --user-fg:#fff;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","Noto Sans Kannada",sans-serif;
    display:flex; flex-direction:column;
  }

  header {
    position:sticky; top:0; z-index:5; background:var(--surface);
    border-bottom:1px solid var(--line); padding:14px 20px;
    display:flex; align-items:center; gap:10px;
  }
  .brand { width:30px; height:30px; border-radius:9px; background:var(--accent);
    display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
  header .title { font-weight:600; font-size:15px; line-height:1.2; }
  header .sub { font-size:12px; color:var(--muted); line-height:1.3; }
  header .restart { margin-left:auto; font-size:12px; color:var(--muted); background:var(--bg);
    border:1px solid var(--line); border-radius:999px; padding:6px 12px; cursor:pointer; }
  header .restart:hover { color:var(--ink); border-color:var(--muted); }

  #log { flex:1; max-width:640px; width:100%; margin:0 auto; padding:20px 16px 150px;
    display:flex; flex-direction:column; gap:3px; }

  .row { display:flex; margin-top:10px; }
  .row.user { justify-content:flex-end; }
  .msg { max-width:80%; padding:11px 14px; border-radius:16px; white-space:pre-wrap;
    line-height:1.5; font-size:14.5px; overflow-wrap:anywhere; }
  .bot .msg { background:var(--surface); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .user .msg { background:var(--user-bg); color:var(--user-fg); border-bottom-right-radius:4px; }
  .msg b { font-weight:650; }
  .msg a { color:inherit; text-decoration:underline; text-decoration-color:currentColor; opacity:.9; }
  .msg audio { display:block; margin-top:8px; width:240px; max-width:100%; }

  /* numbered-menu options rendered as tap chips */
  .opts { display:flex; flex-wrap:wrap; gap:7px; margin:8px 2px 2px; max-width:80%; }
  .opt { background:var(--surface); border:1px solid var(--line); color:var(--ink);
    font-size:13.5px; font-weight:500; padding:8px 14px; border-radius:999px; cursor:pointer;
    transition:border-color .15s, background .15s; }
  .opt:hover { border-color:var(--accent); background:#FFF7EE; }
  .opt:active { transform:scale(.97); }
  .opt.accept { background:var(--ink); color:#fff; border-color:var(--ink); }

  /* dashboard / pay links as a distinct card button */
  .linkcard { display:flex; align-items:center; gap:10px; max-width:80%; margin-top:10px;
    background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px;
    text-decoration:none; color:var(--ink); font-size:14px; font-weight:600; }
  .linkcard:hover { border-color:var(--accent); }
  .linkcard .ico { font-size:18px; }
  .linkcard small { display:block; font-weight:400; color:var(--muted); font-size:12px; margin-top:1px; }

  .typing { display:flex; gap:4px; padding:12px 14px; }
  .typing span { width:6px; height:6px; border-radius:50%; background:var(--muted); opacity:.5;
    animation:bounce 1.1s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay:.15s; }
  .typing span:nth-child(3) { animation-delay:.3s; }
  @keyframes bounce { 0%,60%,100%{ transform:translateY(0); opacity:.4 } 30%{ transform:translateY(-4px); opacity:1 } }

  form { position:fixed; bottom:0; left:0; right:0; background:linear-gradient(var(--bg) 0%, var(--bg) 60%, transparent);
    padding:14px 16px 16px; }
  .bar { max-width:640px; margin:0 auto; display:flex; gap:8px; align-items:flex-end;
    background:var(--surface); border:1px solid var(--line); border-radius:24px; padding:6px 6px 6px 16px;
    box-shadow:0 6px 24px rgba(20,33,61,.07); }
  input[type=text] { flex:1; border:0; outline:0; height:40px; font-size:15px; background:transparent; color:var(--ink); }
  input[type=text]::placeholder { color:var(--muted); }
  label.file, button.send { height:40px; width:40px; border-radius:50%; border:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  label.file { background:var(--bg); font-size:16px; }
  label.file:hover { background:var(--line); }
  button.send { background:var(--accent); color:#fff; font-size:16px; }
  button.send:disabled { opacity:.4; cursor:default; }
  #files { display:none; }
  .picked { max-width:640px; margin:0 auto 6px; display:flex; flex-wrap:wrap; gap:6px; padding:0 2px; }
  .chip { background:var(--surface); border:1px solid var(--line); border-radius:999px; font-size:12px;
    color:var(--muted); padding:4px 10px; }

  .disclaimer { text-align:center; font-size:11.5px; color:var(--muted); padding:4px 24px 0; line-height:1.4; }
</style>
</head>
<body>
<header>
  <div class="brand">📄</div>
  <div>
    <div class="title">Sign Smart</div>
    <div class="sub" id="who">Reading your agreement, in your language</div>
  </div>
  <button class="restart" id="restart">Restart</button>
</header>

<div id="log" aria-live="polite"></div>

<form id="f">
  <div class="picked" id="picked"></div>
  <div class="bar">
    <label class="file" for="files" aria-label="Attach agreement">📎</label>
    <input id="files" type="file" multiple accept="image/*,application/pdf">
    <label for="t" style="position:absolute;left:-9999px">Message</label>
    <input id="t" type="text" placeholder="Message, or tap an option above" autocomplete="off">
    <button class="send" type="submit" aria-label="Send">➤</button>
  </div>
</form>

<script>
  const params = new URLSearchParams(location.search);
  let phone = params.get("phone");
  if (!phone) {
    try { phone = localStorage.getItem("ss_phone"); } catch (e) {}
    if (!phone) { phone = "web:" + Math.random().toString(36).slice(2, 10); }
    try { localStorage.setItem("ss_phone", phone); } catch (e) {}
  }
  document.getElementById("who").textContent =
    phone.startsWith("web:") ? "Guidance, not legal advice · deletes after this chat" : "Chatting as " + phone;

  const log = document.getElementById("log");
  const input = document.getElementById("t");
  const files = document.getElementById("files");
  const picked = document.getElementById("picked");
  let since = 0, typingEl = null, awaitingReply = false;

  const OPT_LINE = /^(\d{1,2})\s+(.{1,80})$/;
  const URL_RE = /(https?:\/\/\S+)/g;

  function escapeHtml(s) {
    return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  }

  function formatInline(text) {
    const esc = escapeHtml(text);
    return esc.replace(/\*([^*\n]+)\*/g, "<b>$1</b>")
               .replace(/_([^_\n]+)_/g, "<i>$1</i>");
  }

  function renderBotMessage(body, mediaUrl) {
    const lines = body.split("\n");
    const optLines = [], textLines = [], linkLines = [];
    for (const line of lines) {
      const trimmed = line.trim();
      const m = OPT_LINE.exec(trimmed);
      if (m && !URL_RE.test(trimmed)) { optLines.push(m); continue; }
      URL_RE.lastIndex = 0;
      if (URL_RE.test(trimmed) && trimmed.replace(URL_RE, "").trim() === "") { linkLines.push(trimmed); continue; }
      textLines.push(line);
    }
    const text = textLines.join("\n").trim();

    if (text) {
      const row = document.createElement("div");
      row.className = "row bot";
      const bubble = document.createElement("div");
      bubble.className = "msg";
      bubble.innerHTML = formatInline(text).replace(URL_RE, '<a href="$1" target="_blank" rel="noopener">$1</a>');
      if (mediaUrl) {
        const a = document.createElement("audio");
        a.controls = true; a.src = mediaUrl;
        bubble.appendChild(a);
      }
      row.appendChild(bubble);
      log.appendChild(row);
    }

    for (const url of linkLines) {
      const isPay = /\/pay\//.test(url);
      const a = document.createElement("a");
      a.className = "linkcard"; a.href = url; a.target = "_blank"; a.rel = "noopener";
      a.innerHTML = `<span class="ico">${isPay ? "💳" : "📊"}</span>
        <span>${isPay ? "Pay securely" : "Open your risk dashboard"}<small>${url}</small></span>`;
      log.appendChild(a);
    }

    if (optLines.length) {
      const wrap = document.createElement("div");
      wrap.className = "opts";
      for (const [, num, label] of optLines) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "opt" + (/accept/i.test(label) ? " accept" : "");
        btn.textContent = label.replace(/^✅\s*/, "");
        btn.onclick = () => sendMessage(num);
        wrap.appendChild(btn);
      }
      log.appendChild(wrap);
    }
  }

  function showTyping() {
    if (typingEl) return;
    typingEl = document.createElement("div");
    typingEl.className = "row bot";
    typingEl.innerHTML = '<div class="msg typing"><span></span><span></span><span></span></div>';
    log.appendChild(typingEl);
    window.scrollTo(0, document.body.scrollHeight);
  }
  function hideTyping() {
    if (typingEl) { typingEl.remove(); typingEl = null; }
  }

  async function poll() {
    try {
      const r = await fetch(`/api/outbox?phone=${encodeURIComponent(phone)}&since=${since}`);
      const msgs = await r.json();
      if (msgs.length) hideTyping();
      for (const m of msgs) {
        since = Math.max(since, m.ts);
        if (m.from === "user") {
          const row = document.createElement("div");
          row.className = "row user";
          row.innerHTML = `<div class="msg">${formatInline(m.body || "")}</div>`;
          log.appendChild(row);
        } else {
          renderBotMessage(m.body || "", m.media);
          awaitingReply = false;
        }
      }
      if (msgs.length) window.scrollTo(0, document.body.scrollHeight);
    } catch (e) {}
  }
  setInterval(poll, 1100);
  poll();

  files.onchange = () => {
    picked.innerHTML = "";
    for (const f of files.files) {
      const chip = document.createElement("span");
      chip.className = "chip"; chip.textContent = "📎 " + f.name;
      picked.appendChild(chip);
    }
  };

  async function sendMessage(text) {
    if (!text.trim() && !files.files.length) return;
    const fd = new FormData();
    fd.append("phone", phone);
    fd.append("text", text);
    for (const f of files.files) fd.append("files", f);
    input.value = ""; files.value = ""; picked.innerHTML = "";
    awaitingReply = true;
    showTyping();
    await fetch("/api/message", { method: "POST", body: fd });
    poll();
  }

  document.getElementById("f").onsubmit = (e) => {
    e.preventDefault();
    sendMessage(input.value);
  };

  document.getElementById("restart").onclick = () => sendMessage("menu");
</script>
</body>
</html>
